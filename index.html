<!DOCTYPE html>
<html>
<head>
  <title>Customer Service Chatbot</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 8px 0; }
    .user { text-align: right; color: #0066cc; }
    .ai { text-align: left; color: #333; }
    input { width: 80%; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Customer Service Chatbot</h2>
  <div id="chat"></div>
  <input id="input" type="text" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    const sessionId = crypto.randomUUID();  // one session per page load
    const chatDiv = document.getElementById("chat");
    const input = document.getElementById("input");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";

      const res = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: message })
      });
      const data = await res.json();
      addMessage(data.reply, "ai");
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
